[General]
network = dronestfg.simulations.DronesNetwork
sim-time-limit = 4000s
seed-set = 0
 
# Registros que no se usan (Lucas)
**.routingRecorder.enabled  = false
**.sctp.enableHeartbeats    = false
**.sctp.**.scalar-recording = false
**.sctp.**.vector-recording = false
**.sctp.nagleEnabled        = false
 
#------------------------------------------------------------------------------
#  Playground (Emilio)
#------------------------------------------------------------------------------
*.playgroundSizeX = 1500m
*.playgroundSizeY = 1300m
*.playgroundSizeZ = 500m
 
# OJO: NO copiar de Lucas "**.mobility.initFromDisplayString = false"
# (VeinsInetMobility exige que sea true y se detendria con un ASSERT) ni sus
# "**.mobility.constraintArea*" (eran para 2000x2000; por defecto INET no
# limita el area).
 
#------------------------------------------------------------------------------
#  TraCI Manager (Emilio)
#------------------------------------------------------------------------------
*.manager.updateInterval = 1s
*.manager.host = "localhost"
*.manager.port = 9999
*.manager.autoShutdown = true
*.manager.launchConfig = xmldoc("launch.xml")
*.manager.order = 1
*.manager.margin = 250
 
# Mapeo de tipos SUMO -> modulos OMNeT++ (Veins exige las mismas claves en
# los tres). "0" = no instanciar. No usar penetrationRate ni roiRects para
# limitar coches: tambien afectan a los UAV y podrian dejar un gNodeB sin UAV.
*.manager.moduleType          = "uav_type=dronestfg.nodes.UAV car_ue=dronestfg.nodes.CarUE *=0"
*.manager.moduleName          = "uav_type=uav car_ue=car *=car"
*.manager.moduleDisplayString = "uav_type='i=block/aircraft' car_ue='i=device/pocketpc;is=vs' *='i=device/pocketpc'"
 
*.roadsVisualizer.drawRoads = true
*.roadsVisualizer.lineWidth = 2
*.roadsVisualizer.roadColor = "gray"
 
#------------------------------------------------------------------------------
#  Direccionamiento IP
#------------------------------------------------------------------------------
*.configurator.config = xmldoc("network_config.xml")
 
#------------------------------------------------------------------------------
#  Radio 5G NR y canal (Lucas)
#------------------------------------------------------------------------------
*.carrierAggregation.componentCarrier[0].carrierFrequency = 2.6GHz
*.carrierAggregation.componentCarrier[0].numBands         = 52
*.carrierAggregation.componentCarrier[0].numerologyIndex  = 0
 
**.ueTxPower     = 23     # dBm
**.eNodeBTxPower = 46     # dBm
 
**.scenario             = "URBAN_MACROCELL"
**.shadowing            = true
**.correlation_distance = 50
**.fading               = true
**.fading_type          = "JAKES"
**.dynamic_los          = true
 
#------------------------------------------------------------------------------
#  gNodeBs embarcados en los UAV
#------------------------------------------------------------------------------
# ============================================================================
#  numGnb: EL UNICO numero que hay que tocar al cambiar la flota.
#  Es el total de UAVs que crea el plugin (total_uavs de main_.py):
#  "Number of UAVs" si Relay Mode = false, y el DOBLE si es true (los
#  sustitutos son uav<N>..uav<2N-1> y arrancan en la base, en STANDBY).
#  Cada gNodeB[i] sigue a "uav<i>", asi que hace falta uno por UAV.
#  Se declara como variable de ini (${N}) para poder reutilizarlo abajo.
# ============================================================================
*.numGnb = ${N=6}
 
*.gNodeB[*].mobility.typename       = "UavFollowerMobility"   # requiere el parche de eNodeB.ned
# Altura: la publica el plugin (plugin_patch). Si no, se usa defaultAltitude.
*.gNodeB[*].mobility.readAltitudeFromSumo = true
*.gNodeB[*].mobility.defaultAltitude      = 25m
*.gNodeB[*].mobility.updateInterval = 1s                      # = manager.updateInterval
# Posicion de espera hasta que el plugin crea los UAV (coordenadas OMNeT++)
*.gNodeB[*].mobility.initialX = 900m
*.gNodeB[*].mobility.initialY = 800m
# Por defecto gNodeB[i] sigue a "uav<i>". Para cambiar el mapeo:
#*.gNodeB[0].mobility.sumoId = "uav0"
 
# Ids de celda. El Binder los reasigna en la inicializacion (1, 2, 3... en
# orden de creacion), asi que estas lineas son informativas; lo que importa es
# que haya una por gNodeB y que no se repitan.
*.gNodeB[*].macCellId = index + 1
*.gNodeB[*].macNodeId = index + 1
 
*.gNodeB[*].cellularNic.nrPhy.targetBler      = 0.1
*.gNodeB[*].cellularNic.phy.enableHandover    = true
*.gNodeB[*].cellularNic.phy.handoverLatency   = 50ms
*.gNodeB[*].cellInfo.broadcastMessageInterval = 1s
 
# ----------------------------------------------------------------------------
#  X2 en malla completa, parametrizado por ${N}: no hay que tocar nada al
#  cambiar el numero de gNodeBs.
#
#  ancestorIndex(1) = indice de la x2App (lo llamamos j)
#  ancestorIndex(2) = indice del gNodeB  (lo llamamos i)
#
#  Peer: gNodeB[i] tiene una x2App por vecino, saltandose a si mismo,
#        asi que x2App[j] habla con  j  si j < i,  y con  j+1  si j >= i.
#
#  Interfaz del peer: cada "x2++" de DronesNetwork.ned crea una interfaz, en
#        el orden del bucle (i<j). Con ese orden, las puertas de gNodeB[k]
#        corresponden a los peers 0..k-1 y luego k+1..N-1, siempre crecientes.
#        Por tanto la interfaz del peer que da a gNodeB[i] es  i-1  si el peer
#        tiene indice menor que i, e  i  si lo tiene mayor.
# ----------------------------------------------------------------------------
*.gNodeB[*].numX2Apps = ${N} - 1
*.gNodeB[*].x2App[*].server.localPort = 6000 + ancestorIndex(1)
*.gNodeB[*].x2App[*].client.connectAddress = "gNodeB[" + string(ancestorIndex(1) < ancestorIndex(2) ? ancestorIndex(1) : ancestorIndex(1) + 1) + "]%x2ppp" + string(ancestorIndex(1) < ancestorIndex(2) ? ancestorIndex(2) - 1 : ancestorIndex(2))
 
#------------------------------------------------------------------------------
#  UEs = coches car_ue  (en el ini de Lucas era *.ue[*])
#------------------------------------------------------------------------------
*.car[*].cellularNic.nrPhy.dynamicCellAssociation = true
*.car[*].masterId    = 0
*.car[*].macCellId   = 0
*.car[*].nrMasterId  = 1
*.car[*].nrMacCellId = 1
 
*.car[*].cellularNic.nrPhy.targetBler    = 0.1
*.car[*].cellularNic.nrPhy.enableHandover = true
 
#------------------------------------------------------------------------------
#  Telemetria hacia el gemelo digital (Lucas)
#------------------------------------------------------------------------------
*.gNodeB[*].numApps = 1
*.gNodeB[*].app[0].typename     = "GnbSender"
*.gNodeB[*].app[0].destAddress  = "server"
*.gNodeB[*].app[0].destPort     = 5000
*.gNodeB[*].app[0].sendInterval = 1s
*.gNodeB[*].app[0].ueVectorName = "car"
 
*.car[*].numApps = 1
*.car[*].app[0].typename     = "UESender"
*.car[*].app[0].destAddress  = "server"
*.car[*].app[0].destPort     = 5000
*.car[*].app[0].sendInterval = 1s
 
*.server.numApps = 2
*.server.app[0].typename  = "Receiver"
*.server.app[0].localPort = 5000
*.server.app[1].typename  = "TcpClient"
*.server.app[1].serverThreadModuleType = ""
